<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#060404">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Welcome to the Hellfire Club – D&D Stranger Things</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Metal+Mania&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mobile.css">
</head>
<body>

<header>
  <div class="header-logo header-logo-left">
    <img src="assets/header/Titolo - DnD.png" alt="Dungeons &amp; Dragons" class="header-img">
  </div>
  <a href="index.html" class="header-center" aria-label="Torna alla home">
    <img src="assets/header/Titolo.png" class="header-img" alt="Hellfire Club">
  </a>
  <div class="header-logo header-logo-right">
    <img src="assets/header/Titolo - Netflix.png" alt="Netflix – Stranger Things" class="header-img">
  </div>
</header>

<main>
  <div class="cards-grid">

    <!-- LIBRETTI — disponibile -->
    <a href="pages/libretti.html" class="card" id="librettiCard">
      <img src="assets/icons/libretti.png" alt="" class="card-icon" aria-hidden="true">
      <div class="card-bg">
        <span class="card-label">LIBRETTI</span>
      </div>
    </a>

    <!-- CARTE — non disponibile -->
    <button type="button" class="card card-folder-missing"
            onclick="showUnavailable()" aria-label="Carte – non disponibile">
      <img src="assets/icons/carte.png" alt="" class="card-icon" aria-hidden="true">
      <div class="card-bg">
        <span class="card-label">CARTE</span>
      </div>
    </button>

    <!-- SCHEDE GIOCATORI — non disponibile -->
    <button type="button" class="card card-folder-missing"
            onclick="showUnavailable()" aria-label="Schede Giocatori – non disponibile">
      <img src="assets/icons/schede_giocatori.png" alt="" class="card-icon" aria-hidden="true">
      <div class="card-bg">
        <span class="card-label">SCHEDE<br>GIOCATORI</span>
      </div>
    </button>

    <!-- SCHERMO MASTER — non disponibile -->
    <button type="button" class="card card-folder-missing"
            onclick="showUnavailable()" aria-label="Schermo Master – non disponibile">
      <img src="assets/icons/schermo_master.webp" alt="" class="card-icon" aria-hidden="true">
      <div class="card-bg">
        <span class="card-label">SCHERMO<br>MASTER</span>
      </div>
    </button>

  </div>
</main>

<!-- Modal "Attualmente non disponibile" -->
<div class="st-modal" id="stModal"
     role="dialog" aria-modal="true" aria-label="Contenuto non disponibile"
     onclick="hideUnavailable()">
  <div class="st-modal-inner">
    <p class="st-modal-label">Attualmente<br>non disponibile</p>
    <p class="st-modal-hint">tocca ovunque per chiudere</p>
  </div>
</div>

<script>
  /* ── Modal ── */
  function showUnavailable() {
    const modal = document.getElementById("stModal");
    modal.classList.add("visible");
  }

  function hideUnavailable() {
    document.getElementById("stModal").classList.remove("visible");
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") hideUnavailable();
  });

  /* ── Libretti card availability check ──────────────────────────────────
   *
   * FIX #2 — doppio fetch con fallback statico
   * ─────────────────────────────────────────────────────────────────────
   * Strategia:
   *   1. Prova il path servito dinamicamente dal server Python
   *      (assets/contenuti/libretti/books.json).
   *   2. Se la risposta non è OK (es. nessun server Python attivo,
   *      deploy su hosting statico, doppio-clic sul file HTML), tenta
   *      il fallback su assets/contenuti/libretti/books.static.json —
   *      un file JSON statico committed nel repo che elenca i PDF
   *      disponibili offline.
   *   3. Solo se entrambi falliscono la card viene disabilitata.
   *
   * Come mantenere books.static.json:
   *   Ogni volta che aggiungi un PDF, aggiorna manualmente
   *   assets/contenuti/libretti/books.static.json con la stessa
   *   struttura di books.json (id, title, category, pdf).
   * ───────────────────────────────────────────────────────────────────── */
  async function updateLibrettiIcon() {
    const card = document.getElementById("librettiCard");
    if (!card) return;

    const DYNAMIC_URL = "assets/contenuti/libretti/books.json";
    const STATIC_URL  = "assets/contenuti/libretti/books.static.json";

    let books = null;

    // Tentativo 1 — feed dinamico (server Python)
    try {
      const r = await fetch(DYNAMIC_URL, { cache: "no-store" });
      if (r.ok) {
        books = await r.json();
      }
    } catch {
      // nessun server attivo — si passa al fallback
    }

    // Tentativo 2 — file statico committed nel repo
    if (!Array.isArray(books)) {
      try {
        const r = await fetch(STATIC_URL, { cache: "default" });
        if (r.ok) {
          books = await r.json();
        }
      } catch {
        // anche il file statico non esiste
      }
    }

    // Applica lo stato alla card
    const hasBooks = Array.isArray(books) && books.length > 0;
    card.classList.toggle("card-folder-missing", !hasBooks);
  }

  document.addEventListener("DOMContentLoaded", updateLibrettiIcon);
</script>

</body>
</html>
